name: Main

on:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: check-main
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup mise
        uses: jdx/mise-action@v5.0.1

      - name: Install dependencies
        run: flutter pub get

      - name: Format
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  deploy:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup mise
        uses: jdx/mise-action@v5.0.1

      - name: Install dependencies
        run: flutter pub get

      - name: Build web (profile)
        run: |
          flutter build web --profile \
            -t lib/main_preview.dart \
            --base-href "/flutter-flame-samples/"
          touch build/web/.nojekyll

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          branch: gh-pages
          folder: build/web
          clean-exclude: |
            pr-preview/
